{% extends 'base.html' %}
{% block title %}Log in{% endblock %}
{% block content %}
<div class="auth-card card">
  <span class="eyebrow">WELCOME BACK</span>
  <h1>Log in</h1>
  <p class="muted">Use your student or admin account.</p>
  <form method="post">
    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
    <label for="email">Email</label>
    <input id="email" name="email" type="email" maxlength="254" required autocomplete="username" value="{{ request.form.get('email', '') }}">
    <label for="password">Password</label>
    <input id="password" name="password" type="password" required autocomplete="current-password">
    <button class="button full" type="submit">Log in</button>
  </form>
  <p class="small">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
{% endblock %}
